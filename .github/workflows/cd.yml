# CD: after CI passes on main -> migrate Neon -> deploy that exact image -> smoke test.

# CD: after CI passes on main -> migrate Neon -> deploy Git-backed Render service -> smoke test.
# Rollback: use Render's deployment history to roll back to a previous successful deployment.
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.LIVE_URL }}
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.11.32"
          enable-cache: true

      - run: uv sync --locked

      - name: Run migrations on Neon
        env:
          APP_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run alembic upgrade head

      - name: Trigger Render deployment
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "Triggering Render deployment for commit ${SHA}"
          curl --fail --silent --show-error -X POST "$HOOK"

      - name: Smoke test the live URL
        run: uv run python scripts/smoke.py "${{ vars.LIVE_URL }}" --expect-version "${SHA}"
