
# Runs on every "git commit". If a hook fails, the commit is stopped.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
        # Allow only the five reviewed large dataset files.
        exclude: ^(data/manifest\.jsonl|data/raw/passportindia/(steps-to-apply-for-passport-services-f9aff960\.pdf|steps-to-submit-an-application-at-psk-179ee910\.pdf|applicationforminstructionbooklet-v3-0-470b5b24\.pdf)|data/raw/mea/passport1980-4547326d\.pdf|data/raw/fastapi/sql-databases-5b402114\.html)$
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        # Exclude generated fingerprints and migration revision IDs.
        exclude: ^(uv\.lock|migrations/versions/.*|data/manifest\.jsonl|data/raw/\.measured\.json)$
